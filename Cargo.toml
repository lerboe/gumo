[package]
name = "gumo"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
clap = "4"
http = "1"
oha = "1.16"
# Must match the rusqlite version of oha, both link the bundled sqlite3.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
